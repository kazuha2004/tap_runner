services:
  - type: web
    name: tap-runners-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: tap_runners
      - key: ALLOWED_ORIGINS
        sync: false
